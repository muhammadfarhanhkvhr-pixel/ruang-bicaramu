<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Bicaramu - Konseling Anonim</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-card {
            max-width: 650px;
            margin: 40px auto;
            border-radius: 12px;
        }
        .ticket-box {
            background-color: #e8f5e9;
            border: 2px dashed #2e7d32;
            border-radius: 8px;
            padding: 15px;
        }
        .reply-box {
            background-color: #ffffff;
            border-left: 4px solid #0d6efd;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card shadow-sm main-card p-4 bg-white">
            <h2 class="text-center fw-bold text-primary mb-1">Ruang Bicaramu</h2>
            <p class="text-center text-muted small mb-4">Layanan Konseling & Pengaduan Anonim Siswa</p>

            <!-- TAB NAVIGASI -->
            <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active fw-bold" id="pills-report-tab" data-bs-toggle="pill" data-bs-target="#pills-report" type="button" role="tab">Kirim Laporan</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-bold" id="pills-check-tab" data-bs-toggle="pill" data-bs-target="#pills-check" type="button" role="tab">Cek Balasan BK</button>
                </li>
            </ul>

            <div class="tab-content" id="pills-tabContent">
                
                <!-- 1. FORM KIRIM LAPORAN -->
                <div class="tab-pane fade show active" id="pills-report" role="tabpanel">
                    <form id="reportForm" onsubmit="submitReport(event)">
                        <div class="mb-3">
                            <label for="category" class="form-label fw-semibold">Kategori Masalah</label>
                            <select id="category" class="form-select" required>
                                <option value="" disabled selected>-- Pilih Kategori --</option>
                                <option value="Bullying / Perundungan">Bullying / Perundungan</option>
                                <option value="Akademik & Belajar">Akademik & Belajar</option>
                                <option value="Masalah Pribadi / Keluarga">Masalah Pribadi / Keluarga</option>
                                <option value="Fasilitas Sekolah">Fasilitas Sekolah</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Isi Laporan / Curhat</label>
                            <textarea id="description" class="form-control" rows="4" placeholder="Tuliskan masalah atau keluhanmu di sini secara lengkap (Identitasmu tetap aman & anonim)..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Kirim Laporan Anonim</button>
                    </form>

                    <!-- Wadah Hasil Setelah Kirim -->
                    <div id="submitResult" class="mt-4" style="display: none;"></div>
                </div>

                <!-- 2. FORM CEK BALASAN BK -->
                <div class="tab-pane fade" id="pills-check" role="tabpanel">
                    <div class="mb-3">
                        <label for="ticketCodeInput" class="form-label fw-semibold">Kode Tiket Laporan</label>
                        <div class="input-group">
                            <input type="text" id="ticketCodeInput" class="form-control" placeholder="Contoh: BK-7A92" style="text-transform: uppercase;">
                            <button onclick="checkReport()" class="btn btn-primary fw-bold">Cek Status</button>
                        </div>
                        <small class="text-muted">Masukkan kode tiket unik yang kamu dapatkan saat mengirim laporan.</small>
                    </div>

                    <!-- Wadah Hasil Cek Tiket -->
                    <div id="checkResult" class="mt-3"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>

    <!-- JavaScript Logika Aplikasi -->
    <script>
        // 1. FUNGSI KIRIM LAPORAN
        async function submitReport(event) {
            event.preventDefault();

            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value.trim();
            const submitResult = document.getElementById('submitResult');

            if (!category || !description) {
                alert('Silakan lengkapi kategori dan isi laporan!');
                return;
            }

            submitResult.style.display = 'block';
            submitResult.innerHTML = '<p class="text-center text-muted">Mengirim laporan ke server...</p>';

            try {
                const response = await fetch('/api/reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, description })
                });

                const result = await response.json();

                if (result.success) {
                    const ticketCode = result.ticketCode || result.ticket_code;
                    
                    submitResult.innerHTML = `
                        <div class="ticket-box text-center">
                            <h5 class="fw-bold text-success mb-2">Laporan Berhasil Terkirim!</h5>
                            <p class="mb-2 text-dark small">Simpan kode tiket di bawah ini untuk mengecek balasan dari Guru BK:</p>
                            <div class="bg-white py-2 px-3 rounded border display-6 fw-bold text-primary mb-2" style="letter-spacing: 2px;">
                                ${ticketCode}
                            </div>
                            <small class="text-danger fw-semibold">*Jangan sampai hilang! Kode ini adalah satu-satunya akses menuju balasan BK.</small>
                        </div>
                    `;

                    document.getElementById('reportForm').reset();
                } else {
                    submitResult.innerHTML = `
                        <div class="alert alert-danger py-2">
                            Gagal mengirim laporan: ${result.message || 'Terjadi kesalahan.'}
                        </div>
                    `;
                }
            } catch (err) {
                console.error(err);
                submitResult.innerHTML = `
                    <div class="alert alert-danger py-2">
                        Gagal terhubung ke server. Periksa koneksi internetmu.
                    </div>
                `;
            }
        }

        // 2. FUNGSI CEK BALASAN GURU BK
        async function checkReport() {
            const ticketInput = document.getElementById('ticketCodeInput').value.trim();
            const checkResult = document.getElementById('checkResult');

            if (!ticketInput) {
                alert('Masukkan kode tiket terlebih dahulu!');
                return;
            }

            checkResult.innerHTML = '<p class="text-center text-muted py-3">Mengecek data laporan...</p>';

            try {
                const response = await fetch(`/api/reports/check/${encodeURIComponent(ticketInput)}`);
                const result = await response.json();

                if (result.success && result.report) {
                    const report = result.report;
                    
                    const isPending = report.status === 'Pending';
                    const statusBadge = isPending 
                        ? '<span class="badge bg-warning text-dark fs-6">Pending</span>' 
                        : '<span class="badge bg-success fs-6">Diproses</span>';

                    const adminReply = report.adminResponse || report.admin_response;
                    const replyContent = adminReply 
                        ? `<p class="mb-0 text-dark fw-semibold">${adminReply}</p>` 
                        : `<p class="mb-0 text-muted italic"><em>Belum ada balasan dari Guru BK. Silakan cek secara berkala.</em></p>`;

                    checkResult.innerHTML = `
                        <div class="card p-3 shadow-sm border-0 bg-light">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="fw-bold text-primary fs-6">Kode Tiket: ${report.ticketCode || report.ticket_code}</span>
                                ${statusBadge}
                            </div>
                            <div class="mb-2">
                                <small class="text-muted d-block">Kategori Masalah:</small>
                                <strong class="text-dark">${report.category}</strong>
                            </div>
                            <div class="mb-3">
                                <small class="text-muted d-block">Isi Laporan Kamu:</small>
                                <p class="mb-0 text-secondary bg-white p-2 rounded border small">${report.description}</p>
                            </div>
                            <hr class="my-2">
                            <div class="reply-box p-3 shadow-sm mt-2">
                                <small class="fw-bold text-primary d-block mb-1">💬 Balasan Resmi Guru BK:</small>
                                ${replyContent}
                            </div>
                        </div>
                    `;
                } else {
                    checkResult.innerHTML = `
                        <div class="alert alert-danger mb-0">
                            ${result.message || 'Kode tiket tidak ditemukan. Pastikan kode yang dimasukkan sudah benar.'}
                        </div>
                    `;
                }
            } catch (err) {
                console.error(err);
                checkResult.innerHTML = `
                    <div class="alert alert-danger mb-0">
                        Terjadi kesalahan koneksi ke server. Silakan coba lagi.
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
