<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Resmi Guru BK - Ruang Bicaramu</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            max-width: 400px;
            margin: 80px auto;
            border-radius: 12px;
        }
        .dashboard-container {
            max-width: 900px;
            margin: 30px auto;
        }
        .card-report {
            border-left: 5px solid #0d6efd;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- 1. SEKSI LOGIN ADMIN -->
    <div id="loginSection" class="container">
        <div class="card shadow login-card p-4 bg-white">
            <h3 class="text-center fw-bold text-primary mb-3">Portal Guru BK</h3>
            <p class="text-muted text-center small mb-4">Masukkan kata sandi resmi untuk mengakses laporan siswa.</p>
            
            <div id="errorMessage" class="alert alert-danger py-2 small" style="display: none;"></div>
            
            <div class="mb-3">
                <label for="adminPassword" class="form-label fw-semibold">Kata Sandi Akses</label>
                <input type="password" id="adminPassword" class="form-control" placeholder="Masukkan password..." onkeyup="handleKeyPress(event)">
            </div>
            <button onclick="loginAdmin()" class="btn btn-primary w-100 fw-bold">Masuk ke Dashboard</button>
        </div>
    </div>

    <!-- 2. SEKSI DASHBOARD ADMIN (Awalnya Tersembunyi) -->
    <div id="dashboardSection" class="container dashboard-container" style="display: none;">
        <div class="d-flex justify-content-between align-items-center bg-white p-3 rounded shadow-sm mb-4">
            <div>
                <h4 class="fw-bold mb-0 text-dark">Dashboard Guru BK <span class="badge bg-success fs-6 ms-2">Akses Resmi</span></h4>
            </div>
            <button onclick="logoutAdmin()" class="btn btn-outline-danger btn-sm fw-semibold">Keluar (Logout)</button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold text-secondary mb-0">Daftar Masuk Laporan Siswa</h5>
            <button onclick="loadAdminReports()" class="btn btn-primary btn-sm fw-semibold">
                🔄 Refresh Data
            </button>
        </div>

        <!-- Wadah Daftar Laporan Siswa -->
        <div id="reportsList">
            <p class="text-center text-muted">Memuat data laporan...</p>
        </div>
    </div>

    <!-- JavaScript Logika Portal -->
    <script>
        // Tangani tombol Enter saat ketik password
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                loginAdmin();
            }
        }

        // 1. Fungsi Login Admin
        async function loginAdmin() {
            const passwordInput = document.getElementById('adminPassword').value;
            const errorMessage = document.getElementById('errorMessage');
            
            errorMessage.style.display = 'none';

            if (!passwordInput) {
                errorMessage.innerText = 'Kata sandi wajib diisi!';
                errorMessage.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: passwordInput })
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('dashboardSection').style.display = 'block';
                    loadAdminReports(); // Muat data laporan dari Supabase
                } else {
                    errorMessage.innerText = result.message || 'Kata sandi salah!';
                    errorMessage.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorMessage.innerText = 'Gagal terhubung ke server.';
                errorMessage.style.display = 'block';
            }
        }

        // 2. Fungsi Logout
        function logoutAdmin() {
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('dashboardSection').style.display = 'none';
        }

        // 3. Fungsi Memuat Semua Laporan Siswa dari Database
        async function loadAdminReports() {
            const reportsList = document.getElementById('reportsList');
            if (!reportsList) return;

            reportsList.innerHTML = '<p class="text-center text-muted py-4">Memuat data laporan...</p>';

            try {
                const response = await fetch('/api/admin/reports');
                const result = await response.json();

                if (result.success) {
                    if (!result.reports || result.reports.length === 0) {
                        reportsList.innerHTML = `
                            <div class="card p-4 text-center shadow-sm">
                                <p class="text-muted mb-0">Belum ada laporan siswa yang masuk.</p>
                            </div>`;
                        return;
                    }

                    let html = '';
                    result.reports.forEach(report => {
                        const tCode = report.ticketCode || report.ticket_code;
                        const statusClass = report.status === 'Pending' ? 'bg-warning text-dark' : 'bg-success';
                        const adminResp = report.adminResponse || report.admin_response || '';

                        html += `
                            <div class="card card-report mb-3 p-3 shadow-sm bg-white">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-primary fs-6">Kode Tiket: ${tCode}</span>
                                    <span class="badge ${statusClass}">${report.status}</span>
                                </div>
                                <h6 class="fw-bold mb-1 text-dark">Kategori: ${report.category}</h6>
                                <p class="mb-3 text-secondary"><strong>Isi Laporan:</strong> ${report.description}</p>
                                <hr class="my-2">
                                <div class="form-group mb-2">
                                    <label class="form-label fw-bold text-dark small">Balasan Guru BK:</label>
                                    <textarea id="reply-${tCode}" class="form-control" rows="2" placeholder="Tuliskan balasan/solusi untuk siswa di sini...">${adminResp}</textarea>
                                </div>
                                <div class="d-flex justify-content-end">
                                    <button class="btn btn-sm btn-success fw-semibold" onclick="sendReply('${tCode}')">
                                        💾 Simpan Balasan
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                    reportsList.innerHTML = html;
                } else {
                    reportsList.innerHTML = '<p class="text-danger text-center py-4">Gagal memuat data laporan dari server.</p>';
                }
            } catch (err) {
                console.error(err);
                reportsList.innerHTML = '<p class="text-danger text-center py-4">Terjadi kesalahan koneksi ke server.</p>';
            }
        }

        // 4. Fungsi Mengirim / Menyimpan Balasan BK
        async function sendReply(ticketCode) {
            const replyText = document.getElementById(`reply-${ticketCode}`).value;

            if (!replyText.trim()) {
                alert('Tuliskan balasan terlebih dahulu!');
                return;
            }

            try {
                const response = await fetch('/api/admin/reply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ticketCode: ticketCode,
                        status: 'Diproses',
                        adminResponse: replyText
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert('Balasan berhasil disimpan!');
                    loadAdminReports(); // Refresh tampilan setelah disimpan
                } else {
                    alert('Gagal menyimpan balasan: ' + result.message);
                }
            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan koneksi.');
            }
        }
    </script>
</body>
</html>
