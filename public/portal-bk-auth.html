<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Guru BK — Ruang Bicaramu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- MODAL LOGIN (MUNCUL PERTAMA KALI KARENA DITERAPKAN PASSWORD) -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white max-w-sm w-full p-6 rounded-2xl shadow-xl space-y-4">
            <div class="text-center space-y-1">
                <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-sm mx-auto">
                    BK
                </div>
                <h2 class="text-base font-bold text-slate-900">Akses Khusus Guru BK</h2>
                <p class="text-xs text-slate-500">Masukkan kata sandi untuk mengelola laporan siswa.</p>
            </div>

            <form id="loginForm" class="space-y-3">
                <div>
                    <input type="password" id="passwordInput" placeholder="Masukkan Kata Sandi..." class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-xs font-medium focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none" required />
                </div>
                <p id="loginError" class="text-[11px] text-rose-600 font-semibold hidden text-center"></p>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 rounded-lg text-xs transition">
                    Masuk ke Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD GURU BK (TERSEMBUNYI SAMPAI USER BERHASIL LOGIN) -->
    <div id="adminDashboard" class="hidden min-h-screen flex flex-col justify-between">
        <div>
            <!-- Header Dashboard -->
            <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
                <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-slate-900">Dashboard Guru BK</span>
                        <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded">Akses Resmi</span>
                    </div>
                    <button onclick="logout()" class="text-xs text-rose-600 hover:underline font-medium">
                        Keluar (Logout)
                    </button>
                </div>
            </header>

            <!-- Main Content Laporan -->
            <main class="max-w-3xl mx-auto px-4 py-6 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                    <h1 class="text-sm font-bold text-slate-900">Daftar Masuk Laporan Siswa</h1>
                    <button onclick="loadReports()" class="text-xs text-blue-600 hover:underline font-medium">
                        🔄 Refresh Data
                    </button>
                </div>

                <!-- Container Tempat Laporan Ditampilkan -->
                <div id="reportsContainer" class="space-y-3">
                    <p class="text-xs text-slate-400">Memuat data laporan...</p>
                </div>
            </main>
        </div>

        <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200">
            Ruang Bicaramu &copy; Panel Pengelola BK
        </footer>
    </div>

    <script>
        // Cek jika sudah pernah login di sesi ini
        if (sessionStorage.getItem('bk_auth') === 'true') {
            showDashboard();
        }

        // Handle Submit Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('passwordInput').value;
            const errorEl = document.getElementById('loginError');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    sessionStorage.setItem('bk_auth', 'true');
                    showDashboard();
                } else {
                    errorEl.innerText = data.error || 'Password salah!';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.innerText = 'Gagal terhubung ke server.';
                errorEl.classList.remove('hidden');
            }
        });

        function showDashboard() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            loadReports();
        }

        function logout() {
            sessionStorage.removeItem('bk_auth');
            location.reload();
        }

        // Load Semua Laporan
        async function loadReports() {
            const container = document.getElementById('reportsContainer');
            try {
                const res = await fetch('/api/reports');
                const reports = await res.json();

                if (!reports || reports.length === 0) {
                    container.innerHTML = '<p class="text-xs text-slate-500 bg-white p-4 rounded-xl border border-slate-200">Belum ada laporan yang masuk.</p>';
                    return;
                }

                container.innerHTML = reports.map(r => `
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3 text-xs">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                            <span class="font-mono font-bold text-blue-600 text-sm">${r.ticket_code}</span>
                            <span class="text-[10px] text-slate-400">${new Date(r.created_at).toLocaleString('id-ID')}</span>
                        </div>
                        <div>
                            <span class="text-slate-400 text-[10px] uppercase font-bold block">Kategori</span>
                            <p class="font-semibold text-slate-800">${r.category}</p>
                        </div>
                        <div>
                            <span class="text-slate-400 text-[10px] uppercase font-bold block">Isi Laporan Siswa</span>
                            <p class="text-slate-700 bg-slate-50 p-2.5 rounded-lg border border-slate-100 leading-relaxed">${r.description}</p>
                        </div>
                        
                        <!-- Form Balas Laporan -->
                        <div class="pt-2 border-t border-slate-100 space-y-2">
                            <div class="flex items-center gap-2">
                                <label class="text-[11px] font-semibold text-slate-600">Status:</label>
                                <select id="status-${r.id}" class="border border-slate-300 rounded px-2 py-1 text-xs bg-white font-medium">
                                    <option value="Pending" ${r.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Diproses" ${r.status === 'Diproses' ? 'selected' : ''}>Diproses</option>
                                    <option value="Selesai" ${r.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
                                </select>
                            </div>
                            <div>
                                <textarea id="resp-${r.id}" rows="2" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:border-blue-600 outline-none" placeholder="Tuliskan balasan / solusi untuk siswa...">${r.admin_response || ''}</textarea>
                            </div>
                            <button onclick="updateReport(${r.id})" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-1.5 rounded-lg text-xs transition">
                                Simpan Balasan
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<p class="text-xs text-rose-500">Gagal memuat data laporan.</p>';
            }
        }

        // Simpan Balasan dari Guru BK
        async function updateReport(id) {
            const status = document.getElementById(`status-${id}`).value;
            const admin_response = document.getElementById(`resp-${id}`).value;

            try {
                const res = await fetch(`/api/reports/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status, admin_response })
                });

                if (res.ok) {
                    alert('Balasan berhasil disimpan!');
                    loadReports();
                } else {
                    alert('Gagal menyimpan balasan.');
                }
            } catch (err) {
                alert('Terjadi kesalahan koneksi.');
            }
        }
    </script>
</body>
</html>
